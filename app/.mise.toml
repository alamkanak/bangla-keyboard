[tools]
rust = "stable"
node = "24"

[tools.cargo-binstall]
version = "latest"

[env]
CARGO_INSTALL_ROOT = "{{config_root}}/.mise/cargo-bin"
_.path = ["{{config_root}}/.mise/cargo-bin/bin"]

[tasks.test]
run = "cargo test --workspace"

[tasks.dev]
run = "cargo tauri dev"
dir = "crates/tauri-settings"

[tasks.lint]
run = "cargo fmt --all && cargo clippy --workspace -- -D warnings"

[tasks.build-macos]
run = "xcodebuild -scheme BanglaKeyboard -configuration Debug"
dir = "platform/macos"

[tasks.build-windows]
run = "cmake -B build && cmake --build build"
dir = "platform/windows"
