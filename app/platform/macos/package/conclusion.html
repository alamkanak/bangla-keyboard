<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            line-height: 1.7;
            padding: 20px;
            font-size: 14px;
            --text: #1d1d1f;
            --text-dim: #86868b;
            --num: #007aff;
        }

        @media (prefers-color-scheme: dark) {
            body {
                --text: #e0e0e0;
                --text-dim: #98989f;
                --num: #64d2ff;
            }
        }

        h2 {
            font-size: 16px;
            margin-bottom: 20px;
        }

        p {
            margin: 0 0 12px 0;
            font-size: 14px;
        }

        p .num {
            font-weight: 700;
            color: var(--num);
            margin-right: 4px;
        }

        .sub {
            font-size: 12px;
            color: var(--text-dim);
            margin: 2px 0 0 20px;
        }
    </style>
</head>

<body>
    <h2>✅ Installed! Two things left:</h2>

    <p><span class="num">1.</span> <strong>Click "Allow"</strong> when macOS asks to add Bangla Keyboard</p>

    <p><span class="num">2.</span> <strong>Log Out</strong> and log back in</p>
    <p class="sub"> Apple menu → Log Out</p>
    </div>
</body>

</html>
