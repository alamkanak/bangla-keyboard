<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            font-size: 13px;
            --text-color: #333;
            --bg-action: #fff0f0;
            --border-action: #ff3b30;
            --accent: #007aff;
        }

        @media (prefers-color-scheme: dark) {
            body {
                --text-color: #e0e0e0;
                --bg-action: #3a2020;
                --border-action: #ff453a;
                --accent: #64b5f6;
            }
        }

        h2 {
            font-size: 16px;
            margin-bottom: 16px;
        }

        .action-box {
            background: var(--bg-action);
            border: 2px solid var(--border-action);
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 15px;
        }

        .action-box .num {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            background: var(--border-action);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            margin-right: 8px;
        }

        .action-box .action {
            margin-bottom: 10px;
        }

        .action-box .sub {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 2px;
            margin-left: 32px;
        }
    </style>
</head>

<body>
    <h2>✅ Installed! Two things left:</h2>

    <div class="action-box">
        <div class="action">
            <span class="num">1</span>
            <strong>Click "Allow"</strong> when macOS asks to add Bangla Keyboard
        </div>
        <div class="action">
            <span class="num">2</span>
            <strong>Log Out</strong> and log back in
            <div class="sub">Apple menu → Log Out</div>
        </div>
    </div>
</body>

</html>
