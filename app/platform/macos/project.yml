name: BanglaKeyboard
options:
  bundleIdPrefix: dev.banglakeyboard
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_OBJC_BRIDGING_HEADER: BanglaKeyboard/BanglaKeyboard-Bridging-Header.h
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../../crates/engine-ffi
    LIBRARY_SEARCH_PATHS:
      - $(SRCROOT)/../../target/release
      - $(SRCROOT)/../../target/debug
    OTHER_LDFLAGS:
      - -lengine_ffi
      - -lresolv

targets:
  BanglaKeyboard:
    type: application
    platform: macOS
    sources:
      - path: BanglaKeyboard
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.banglakeyboard.inputmethod
        INFOPLIST_FILE: Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: BanglaKeyboard/BanglaKeyboard.entitlements
    preBuildScripts:
      - name: Build Rust Engine
        script: |
          cd "${SRCROOT}/../.."
          if [ "${CONFIGURATION}" = "Release" ]; then
            cargo build -p engine-ffi --release
          else
            cargo build -p engine-ffi
          fi
        inputFiles: []
        outputFiles: []
    postBuildScripts:
      - name: Copy Data Files
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/data"
          cp -R "${SRCROOT}/../../data/" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/data/"
        inputFiles: []
        outputFiles: []
