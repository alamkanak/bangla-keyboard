[workspace]
members = ["crates/engine-core", "crates/engine-ffi", "crates/tauri-settings"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/bangla-keyboard"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
zstd = "0.13"
